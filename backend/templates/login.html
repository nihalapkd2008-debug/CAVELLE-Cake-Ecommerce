{% extends "base.html" %}

{% block title %}
Login | CAVELLE
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <p class="section-label">
            WELCOME BACK
        </p>

        <h1>
            Login to CAVELLE
        </h1>

        <p class="auth-description">
            Sign in to manage your orders and discover your favourites.
        </p>

        <form id="loginForm" class="auth-form">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <p
                id="loginMessage"
                class="form-message"
            ></p>


            <button
                type="submit"
                class="primary-btn full-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="/register/">
                Create one
            </a>

        </p>

    </div>

</section>

{% endblock %}
