{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}CAVELLE{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>


    <!-- BACKGROUND WATERMARK -->

    <div
        class="site-watermark"
        aria-hidden="true"
    >

        <img
            src="{% static 'images/cavelle-logo.png' %}"
            alt=""
        >

    </div>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">


            <!-- CAVELLE LOGO -->

            <a
                href="/"
                class="logo"
            >

                <img
                    src="{% static 'images/cavelle-logo.png' %}"
                    alt="CAVELLE"
                >

            </a>


            <!-- NAVIGATION -->

            <nav class="nav-links">

                <a href="/">
                    Home
                </a>

                <a href="/products/">
                    Cakes
                </a>


                <!-- WISHLIST -->

                <a
                    href="/wishlist/"
                    class="wishlist-nav-link"
                >

                    Wishlist

                    <span
                        id="wishlistCount"
                        class="wishlist-count"
                        style="display: none;"
                    >
                        0
                    </span>

                </a>


                <a href="/cart/">
                    Cart
                </a>

                <a href="/orders/">
                    Orders
                </a>

            </nav>


            <!-- NAV ACTION -->

            <div class="nav-actions">

                <a
                    href="/login/"
                    class="login-btn"
                >
                    Login
                </a>

            </div>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-container">


            <!-- BRAND -->

            <div class="footer-brand">

                <h2>
                    CAVELLE
                </h2>

                <p>
                    Crafted with elegance,<br>
                    baked with love.
                </p>

            </div>


            <!-- EXPLORE -->

            <div class="footer-links">

                <h3>
                    Explore
                </h3>

                <a href="/">
                    Home
                </a>

                <a href="/products/">
                    Cakes
                </a>

                <a href="/wishlist/">
                    Wishlist
                </a>

                <a href="/cart/">
                    Cart
                </a>

                <a href="/orders/">
                    Orders
                </a>

            </div>


            <!-- ACCOUNT -->

            <div class="footer-links">

                <h3>
                    Account
                </h3>

                <a href="/login/">
                    Login
                </a>

                <a href="/register/">
                    Register
                </a>

            </div>

        </div>


        <!-- COPYRIGHT -->

        <div class="footer-bottom">

            <p>
                © 2026 CAVELLE. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="{% static 'js/main.js' %}"></script>


    <!-- WISHLIST NAVBAR COUNT -->

    <script>

    document.addEventListener(
        "DOMContentLoaded",
        loadWishlistCount
    );


    async function loadWishlistCount() {

        const token =
            localStorage.getItem(
                "access_token"
            );


        const countElement =
            document.getElementById(
                "wishlistCount"
            );


        if (
            !token ||
            !countElement
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    "/api/products/cakes/wishlist/",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


            if (
                response.status === 401
            ) {

                localStorage.removeItem(
                    "access_token"
                );

                localStorage.removeItem(
                    "refresh_token"
                );

                return;

            }


            if (!response.ok) {

                return;

            }


            const cakes =
                await response.json();


            const count =
                cakes.length;


            if (count > 0) {

                countElement.textContent =
                    count;

                countElement.style.display =
                    "inline-flex";

            } else {

                countElement.style.display =
                    "none";

            }

        } catch (error) {

            console.error(
                "Wishlist count error:",
                error
            );

        }

    }

    </script>

</body>
</html>
